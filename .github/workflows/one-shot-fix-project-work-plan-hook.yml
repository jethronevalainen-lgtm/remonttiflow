name: One-shot fix project work plan hook

on:
  push:
    branches:
      - feat/generic-project-work-plans

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/generic-project-work-plans
          fetch-depth: 0

      - name: Stabilize plan reload callback
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/ProjectWorks.tsx')
          source = path.read_text()

          old_import = "import { useEffect, useMemo, useState } from 'react';\n"
          new_import = "import { useCallback, useEffect, useMemo, useState } from 'react';\n"
          if old_import not in source:
              raise SystemExit('react import anchor missing')
          source = source.replace(old_import, new_import, 1)

          old_block = """  const reloadPlans = async () => {\n    if (!currentOrg || !projectId) return;\n    setPlansLoading(true);\n    try {\n      setPlans(await loadProjectWorkPlans({ organizationId: currentOrg.id, projectId }));\n    } catch (caught) {\n      setOperationError(caught instanceof Error ? caught.message : 'Työkokonaisuuksien haku epäonnistui.');\n    } finally {\n      setPlansLoading(false);\n    }\n  };\n\n  useEffect(() => {\n    void reloadPlans();\n  }, [currentOrg?.id, projectId]);\n"""
          new_block = """  const organizationId = currentOrg?.id;\n  const reloadPlans = useCallback(async () => {\n    if (!organizationId || !projectId) return;\n    setPlansLoading(true);\n    try {\n      setPlans(await loadProjectWorkPlans({ organizationId, projectId }));\n    } catch (caught) {\n      setOperationError(caught instanceof Error ? caught.message : 'Työkokonaisuuksien haku epäonnistui.');\n    } finally {\n      setPlansLoading(false);\n    }\n  }, [organizationId, projectId]);\n\n  useEffect(() => {\n    void reloadPlans();\n  }, [reloadPlans]);\n"""
          if old_block not in source:
              raise SystemExit('reloadPlans anchor missing')
          path.write_text(source.replace(old_block, new_block, 1))
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-project-work-plan-hook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProjectWorks.tsx .github/workflows/one-shot-fix-project-work-plan-hook.yml
          git commit -m "fix: stabilize project work plan reload"
          git push origin HEAD:feat/generic-project-work-plans
