name: One-time CRM aftercare hardening

on:
  push:
    branches:
      - agent/crm-aftercare

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-aftercare
          fetch-depth: 0

      - name: Apply exact aftercare hardening fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            Path('supabase/migrations/20260727221000_crm_aftercare_cases.sql'): [
              (
                "create index if not exists customer_cases_customer_idx\n  on public.customer_cases(organization_id, customer_id, created_at desc);\n",
                "create index if not exists customer_cases_customer_idx\n  on public.customer_cases(organization_id, customer_id, created_at desc);\ncreate index if not exists customer_cases_customer_id_idx\n  on public.customer_cases(customer_id);\n",
              ),
            ],
            Path('src/lib/supabase/crmAftercare.ts'): [
              ("  warrantyCovered?: boolean;\n", "  warrantyCovered?: boolean | null;\n"),
              ("  customerDecision?: CustomerCaseDecision;\n", "  customerDecision?: CustomerCaseDecision | null;\n"),
            ],
            Path('src/components/crm/CrmAftercarePanel.tsx'): [
              (
                "        warrantyCovered: form.warrantyCovered === 'unknown' ? undefined : form.warrantyCovered === 'yes',\n",
                "        warrantyCovered: form.warrantyCovered === 'unknown' ? null : form.warrantyCovered === 'yes',\n",
              ),
              (
                "        customerDecision: form.status === 'Odottaa asiakkaan hyväksyntää' ? 'Odottaa' as const : undefined,\n        closedAt: TERMINAL_STATUSES.includes(form.status) ? new Date().toISOString() : undefined,\n",
                "        customerDecision: form.status === 'Odottaa asiakkaan hyväksyntää'\n          ? 'Odottaa' as const\n          : TERMINAL_STATUSES.includes(form.status)\n            ? editing?.customerDecision ?? null\n            : null,\n        closedAt: TERMINAL_STATUSES.includes(form.status)\n          ? editing?.closedAt ?? new Date().toISOString()\n          : '',\n",
              ),
            ],
          }

          for path, pairs in replacements.items():
            content = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in content:
                raise SystemExit(f'Expected source fragment missing from {path}: {old!r}')
              content = content.replace(old, new, 1)
            path.write_text(content, encoding='utf-8')

          Path('.github/workflows/agent-aftercare-fixes.yml').unlink()

      - name: Commit hardening and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260727221000_crm_aftercare_cases.sql src/lib/supabase/crmAftercare.ts src/components/crm/CrmAftercarePanel.tsx .github/workflows/agent-aftercare-fixes.yml
          git commit -m "Harden CRM aftercare state transitions"
          git push origin HEAD:agent/crm-aftercare
