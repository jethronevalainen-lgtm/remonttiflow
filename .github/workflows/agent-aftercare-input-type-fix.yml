name: One-time CRM aftercare input type fix

on:
  push:
    branches:
      - agent/crm-aftercare

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-aftercare
          fetch-depth: 0

      - name: Align nullable CRM input types
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/supabase/crmAftercare.ts')
          content = path.read_text(encoding='utf-8')
          old = "  warrantyCovered?: boolean;\n  rootCause?: string;\n  resolution?: string;\n  estimatedCostCents?: number;\n  actualCostCents?: number;\n  customerVisible?: boolean;\n  customerDecision?: CustomerCaseDecision;\n  closedAt?: string;\n};"
          new = "  warrantyCovered?: boolean | null;\n  rootCause?: string;\n  resolution?: string;\n  estimatedCostCents?: number;\n  actualCostCents?: number;\n  customerVisible?: boolean;\n  customerDecision?: CustomerCaseDecision | null;\n  closedAt?: string;\n};"
          if old not in content:
            raise SystemExit('Expected CustomerCaseInput block missing')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/agent-aftercare-input-type-fix.yml').unlink()

      - name: Commit type fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/crmAftercare.ts .github/workflows/agent-aftercare-input-type-fix.yml
          git commit -m "Align CRM aftercare nullable input types"
          git push origin HEAD:agent/crm-aftercare
