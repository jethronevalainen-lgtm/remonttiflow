name: Finish issue 187

on:
  push:
    branches:
      - fix/issue-187-unit-import

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[issue-187-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        run: python scripts/finish_issue_187.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production quality gate
        run: npm run ship:check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Toteuta huoneistotuonti ja kohteiden järjestäminen [issue-187-ready]"
          git push origin HEAD:fix/issue-187-unit-import
