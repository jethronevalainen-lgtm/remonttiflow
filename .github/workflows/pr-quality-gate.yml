name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production quality gate
        id: quality
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: ${{ github.head_ref }}
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set +e
          npm run ship:check > quality-gate.log 2>&1
          exit_code=$?
          set -e
          tail -n 120 quality-gate.log
          exit "$exit_code"

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-log
          path: quality-gate.log
          if-no-files-found: error
          retention-days: 3

  authenticated-application-smoke:
    name: Authenticated multi-role application smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || secrets.E2E_EMAIL || secrets.E2E_USER_MAIL || secrets.E2E_EMAIL_ADDRESS || secrets.TEST_USER_EMAIL || secrets.TEST_EMAIL || secrets.TEST_ADMIN_EMAIL || vars.E2E_USER_EMAIL || vars.E2E_EMAIL || vars.E2E_USER_MAIL || vars.TEST_USER_EMAIL || vars.TEST_EMAIL || vars.TEST_ADMIN_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || secrets.E2E_PASSWORD || secrets.TEST_USER_PASSWORD || secrets.TEST_PASSWORD || secrets.TEST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate authenticated smoke credentials
        shell: bash
        run: |
          test -n "$E2E_USER_EMAIL" || { echo "Missing test email. Supported GitHub secret or variable names: E2E_USER_EMAIL, E2E_EMAIL, E2E_USER_MAIL, E2E_EMAIL_ADDRESS, TEST_USER_EMAIL, TEST_EMAIL, TEST_ADMIN_EMAIL"; exit 1; }
          test -n "$E2E_USER_PASSWORD" || { echo "Missing test password. Supported GitHub secret names: E2E_USER_PASSWORD, E2E_PASSWORD, TEST_USER_PASSWORD, TEST_PASSWORD, TEST_ADMIN_PASSWORD"; exit 1; }

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test every role and dynamic application route
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      - name: Upload authenticated smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-application-smoke-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
