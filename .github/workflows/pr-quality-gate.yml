name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production quality gate
        id: quality
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: ${{ github.head_ref }}
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set +e
          npm run ship:check > quality-gate.log 2>&1
          exit_code=$?
          set -e
          tail -n 120 quality-gate.log
          exit "$exit_code"

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-log
          path: quality-gate.log
          if-no-files-found: error
          retention-days: 3

# Authenticated role E2E fixtures are prohibited in production.
# Run them only against an isolated Supabase project outside this workflow.
