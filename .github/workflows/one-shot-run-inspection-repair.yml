name: One-shot inspection repair

on:
  push:
    branches:
      - fix/inspection-signature-and-photo-preview

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inspection-signature-and-photo-preview
      - name: Apply repair script
        run: python scripts/patch-inspection-signature-photo.py
      - name: Commit repair
        run: |
          rm scripts/patch-inspection-signature-photo.py
          rm .github/workflows/one-shot-run-inspection-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/one-shot-run-inspection-repair.yml
          git commit -m "fix: repair inspection signatures and photo previews"
          git push origin HEAD:fix/inspection-signature-and-photo-preview
