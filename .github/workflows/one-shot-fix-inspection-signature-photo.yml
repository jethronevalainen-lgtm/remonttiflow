name: One-shot signature type fix

on:
  push:
    branches:
      - fix/inspection-signature-and-photo-preview

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inspection-signature-and-photo-preview
      - name: Fix signature type and commit
        run: |
          sed -i "s/signature_type: 'Käsin allekirjoitettu'/signature_type: 'Piirretty allekirjoitus'/" src/lib/supabase/inspectionSignatures.ts
          rm .github/workflows/one-shot-fix-inspection-signature-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/inspectionSignatures.ts .github/workflows/one-shot-fix-inspection-signature-photo.yml
          git commit -m "fix: use allowed handwritten signature type"
          git push origin HEAD:fix/inspection-signature-and-photo-preview
