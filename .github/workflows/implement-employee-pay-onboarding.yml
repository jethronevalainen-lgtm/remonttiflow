import {
  formatEmployeePay,
  parseLocalizedDecimal,
  parseLocalizedMoneyToCents,
} from '@/lib/employeeCompensationOnboarding';

describe('employee compensation onboarding', () => {
  it('parses Finnish decimal values', () => {
    expect(parseLocalizedDecimal('37,5')).toBe(37.5);
    expect(parseLocalizedDecimal(' 18.25 ')).toBe(18.25);
    expect(parseLocalizedDecimal('')).toBeNull();
    expect(parseLocalizedDecimal('abc')).toBeNull();
  });

  it('stores money as integer cents', () => {
    expect(parseLocalizedMoneyToCents('18,75')).toBe(1875);
    expect(parseLocalizedMoneyToCents('3 250,40')).toBe(325040);
  });

  it('formats hourly and monthly pay unambiguously', () => {
    expect(formatEmployeePay('Tuntipalkka', 1875)).toContain('/ h');
    expect(formatEmployeePay('Kuukausipalkka', 325000)).toContain('/ kk');
    expect(formatEmployeePay('', null)).toBe('Ei määritetty');
  });
});
""")

