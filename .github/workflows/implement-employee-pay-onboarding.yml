name: Implement employee pay onboarding

on:
  push:
    branches:
      - feature/employee-pay-onboarding

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[employee-pay-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/employee-pay-onboarding
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}\n--- needle ---\n{old}')
              file.write_text(text.replace(old, new, 1))

          helper = Path('src/lib/employeeCompensationOnboarding.ts')
          helper.write_text("""export type EmployeePayType = 'Kuukausipalkka' | 'Tuntipalkka';

export function parseLocalizedDecimal(value: string): number | null {
  const normalized = value.trim().replaceAll(' ', '').replace(',', '.');
  if (!normalized) return null;
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : null;
}

export function parseLocalizedMoneyToCents(value: string): number | null {
  const parsed = parseLocalizedDecimal(value);
  return parsed == null ? null : Math.round(parsed * 100);
}

export function formatEmployeePay(
  payType: EmployeePayType | '',
  amountCents: number | null,
): string {
  if (!payType || amountCents == null) return 'Ei määritetty';
  const amount = new Intl.NumberFormat('fi-FI', {
    style: 'currency',
    currency: 'EUR',
  }).format(amountCents / 100);
  return payType === 'Tuntipalkka' ? `${amount} / h` : `${amount} / kk`;
}
""")

