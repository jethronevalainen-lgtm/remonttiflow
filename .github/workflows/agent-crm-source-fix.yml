name: One-time CRM source compatibility fix

on:
  push:
    branches:
      - agent/crm-operating-system

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-operating-system
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/lib/supabase/domainData.ts'): [
                  (
                      "const CRM_STAGES = ['Uusi', 'Tarjous tehty', 'Neuvottelu', 'Sopimus'] as const;",
                      "const CRM_STAGES = [\n  'Uusi',\n  'Kartoitus sovittu',\n  'Kartoitettu',\n  'Tarjous laskennassa',\n  'Tarjous lähetetty',\n  'Neuvottelu',\n  'Voitettu',\n  'Hävitty',\n  'Jäissä',\n] as const;",
                  ),
              ],
              Path('src/hooks/__tests__/useAppData.test.ts'): [
                  ("{ stage: 'Sopimus' }", "{ stage: 'Voitettu' }"),
                  ("toBe('Sopimus')", "toBe('Voitettu')"),
              ],
              Path('src/pages/CRM.tsx'): [
                  ("  Euro,\n", ""),
                  ("  XCircle,\n", ""),
                  ("  const todayIso = today.toISOString();\n", ""),
              ],
          }

          for path, pairs in replacements.items():
              content = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in content:
                      raise SystemExit(f'Expected source fragment missing from {path}: {old!r}')
                  content = content.replace(old, new, 1)
              path.write_text(content, encoding='utf-8')

          Path('.github/workflows/agent-crm-source-fix.yml').unlink()

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/domainData.ts src/hooks/__tests__/useAppData.test.ts src/pages/CRM.tsx .github/workflows/agent-crm-source-fix.yml
          git commit -m "Fix CRM type compatibility and unused imports"
          git push origin HEAD:agent/crm-operating-system
