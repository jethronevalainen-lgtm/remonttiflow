name: One-time CRM aftercare SQL hardening

on:
  push:
    branches:
      - agent/crm-aftercare

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-aftercare
          fetch-depth: 0

      - name: Apply exact SQL hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/migrations/20260727221000_crm_aftercare_cases.sql')
          content = path.read_text(encoding='utf-8')

          trigger_marker = "create trigger create_case_from_reclamation_request\nafter insert on public.customer_work_requests\nfor each row execute function private.create_case_from_reclamation_request();\n\n"
          backfill = trigger_marker + "insert into public.customer_cases (\n  organization_id,\n  customer_id,\n  site_id,\n  project_id,\n  work_request_id,\n  case_type,\n  title,\n  description,\n  reported_by_name,\n  reported_by_phone,\n  reported_at,\n  priority,\n  due_at,\n  customer_visible,\n  created_by\n)\nselect\n  r.organization_id,\n  r.customer_id,\n  p.customer_site_id,\n  r.project_id,\n  r.id,\n  'Reklamaatio',\n  r.title,\n  r.description,\n  r.contact_name,\n  r.contact_phone,\n  r.created_at,\n  case r.urgency\n    when 'Kiireellinen' then 'Kriittinen'\n    when 'Ei kiireellinen' then 'Matala'\n    else 'Normaali'\n  end,\n  case\n    when r.requested_date is not null then r.requested_date::timestamptz + interval '16 hours'\n    else r.created_at + interval '3 days'\n  end,\n  true,\n  r.created_by\nfrom public.customer_work_requests r\njoin public.projects p\n  on p.id = r.project_id\n and p.organization_id = r.organization_id\nwhere r.category = 'Reklamaatio'\non conflict (work_request_id) do nothing;\n\n"
          if trigger_marker not in content:
            raise SystemExit('Trigger marker missing')
          content = content.replace(trigger_marker, backfill, 1)

          decision_marker = "  if p_decision not in ('Hyväksytty', 'Hylätty') then\n    raise exception 'invalid decision' using errcode = '22023';\n  end if;\n\n"
          decision_guard = decision_marker + "  if p_decision = 'Hylätty' and nullif(btrim(p_note), '') is null then\n    raise exception 'rejection note is required' using errcode = '22023';\n  end if;\n\n"
          if decision_marker not in content:
            raise SystemExit('Decision marker missing')
          content = content.replace(decision_marker, decision_guard, 1)

          path.write_text(content, encoding='utf-8')
          Path('.github/workflows/agent-aftercare-sql-hardening.yml').unlink()

      - name: Commit SQL hardening and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260727221000_crm_aftercare_cases.sql .github/workflows/agent-aftercare-sql-hardening.yml
          git commit -m "Backfill complaint requests and require rejection reasons"
          git push origin HEAD:agent/crm-aftercare
