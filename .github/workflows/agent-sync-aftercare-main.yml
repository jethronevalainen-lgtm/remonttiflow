name: One-time sync CRM aftercare with main

on:
  push:
    branches:
      - agent/crm-aftercare

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-aftercare
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/agent-sync-aftercare-main.yml
          git add .github/workflows/agent-sync-aftercare-main.yml
          git commit -m "Remove one-time branch sync workflow"
          git push origin HEAD:agent/crm-aftercare
