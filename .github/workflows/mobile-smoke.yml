name: Mobile Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-smoke:
    name: Pixel 7 responsive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile smoke tests
        run: npx playwright test e2e/mobile-smoke.spec.ts --project=mobile-chromium

      - name: Upload mobile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
