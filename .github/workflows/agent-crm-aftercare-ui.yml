name: One-time CRM aftercare UI patch

on:
  push:
    branches:
      - agent/crm-aftercare

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/crm-aftercare
          fetch-depth: 0

      - name: Patch CRM aftercare tab
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/CRM.tsx')
          content = path.read_text(encoding='utf-8')
          replacements = [
            (
              "import { Badge } from '@/components/ui/badge';",
              "import { CrmAftercarePanel } from '@/components/crm/CrmAftercarePanel';\nimport { Badge } from '@/components/ui/badge';",
            ),
            (
              "            <TabsTrigger value=\"customers\">Asiakkaat ({customers.length})</TabsTrigger>\n            <TabsTrigger value=\"reports\">Myynnin analyysi</TabsTrigger>",
              "            <TabsTrigger value=\"customers\">Asiakkaat ({customers.length})</TabsTrigger>\n            <TabsTrigger value=\"aftercare\">Reklamaatiot ja takuu</TabsTrigger>\n            <TabsTrigger value=\"reports\">Myynnin analyysi</TabsTrigger>",
            ),
            (
              "        <TabsContent value=\"reports\" className=\"space-y-4\">",
              "        <TabsContent value=\"aftercare\" className=\"space-y-4\">\n          <CrmAftercarePanel />\n        </TabsContent>\n\n        <TabsContent value=\"reports\" className=\"space-y-4\">",
            ),
          ]
          for old, new in replacements:
            if old not in content:
              raise SystemExit(f'Expected source fragment missing: {old!r}')
            content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          Path('.github/workflows/agent-crm-aftercare-ui.yml').unlink()

      - name: Commit patched CRM and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CRM.tsx .github/workflows/agent-crm-aftercare-ui.yml
          git commit -m "Integrate aftercare workspace into CRM"
          git push origin HEAD:agent/crm-aftercare
