name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vakantti-production
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp
  CF_PAGES: "1"
  CF_PAGES_BRANCH: main
  CF_PAGES_URL: https://vakantti.pages.dev
  CF_PAGES_COMMIT_SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Build, deploy and verify Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production quality gate
        run: npm run ship:check

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Ensure Cloudflare production branch is main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/vakantti" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"

          node - "$response_file" "$http_status" <<'NODE'
          const fs = require('node:fs');
          const [responseFile, httpStatus] = process.argv.slice(2);
          const raw = fs.readFileSync(responseFile, 'utf8');
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            console.error(`Cloudflare project update returned invalid JSON (HTTP ${httpStatus}).`);
            process.exit(1);
          }
          if (httpStatus < 200 || httpStatus >= 300 || payload?.success !== true) {
            console.error(`Cloudflare project update failed (HTTP ${httpStatus}).`);
            console.error(JSON.stringify(payload?.errors ?? payload, null, 2));
            process.exit(1);
          }
          if (payload?.result?.production_branch !== 'main') {
            console.error(`Cloudflare production branch is ${payload?.result?.production_branch ?? 'missing'}, expected main.`);
            process.exit(1);
          }
          console.log('Cloudflare Pages production branch verified as main.');
          NODE

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=vakantti \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify production release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastFailure = 'not checked';

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              const suffix = `${expected}-${attempt}-${Date.now()}`;
              const versionResponse = await fetch(
                `https://vakantti.pages.dev/version.json?verify=${suffix}`,
                { cache: 'no-store' },
              );
              const versionBody = await versionResponse.text();
              let metadata = null;
              try {
                metadata = JSON.parse(versionBody);
              } catch {
                metadata = null;
              }

              const rootResponse = await fetch(
                `https://vakantti.pages.dev/?verify=${suffix}`,
                { cache: 'no-store' },
              );
              const permissionsPolicy = rootResponse.headers.get('permissions-policy') || '';

              const valid =
                versionResponse.ok
                && metadata?.commit === expected
                && metadata?.branch === 'main'
                && metadata?.environment === 'production'
                && rootResponse.ok
                && /(?:^|,\s*)geolocation=\(self\)(?:,|$)/i.test(permissionsPolicy);

              if (valid) {
                console.log(`Verified production commit ${metadata.commit}`);
                console.log(`Permissions-Policy: ${permissionsPolicy}`);
                process.exit(0);
              }

              lastFailure = [
                `attempt=${attempt}`,
                `versionStatus=${versionResponse.status}`,
                `commit=${metadata?.commit ?? 'missing'}`,
                `branch=${metadata?.branch ?? 'missing'}`,
                `environment=${metadata?.environment ?? 'missing'}`,
                `rootStatus=${rootResponse.status}`,
                `permissionsPolicy=${permissionsPolicy || 'missing'}`,
              ].join(' ');
              console.log(lastFailure);
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error);
              console.log(`attempt=${attempt} error=${lastFailure}`);
            }
            await sleep(10_000);
          }

          console.error(`Production verification failed: ${lastFailure}`);
          process.exit(1);
          NODE
