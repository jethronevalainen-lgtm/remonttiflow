name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vakantti-production
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp
  CF_PAGES: "1"
  CF_PAGES_BRANCH: main
  CF_PAGES_URL: https://vakantti.pages.dev

jobs:
  deploy:
    name: Build, deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 0 ]; then
            tail -n 30 /tmp/npm-ci.log
            annotation="$(tail -n 12 /tmp/npm-ci.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error file=package-lock.json,line=1,title=npm ci failed::$annotation"
            exit "$exit_code"
          fi

          tail -n 20 /tmp/npm-ci.log

      - name: Run production quality gate
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: npm run ship:check

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name vakantti \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${{ github.event.head_commit.message || 'Manual production deployment' }}"

      - name: Verify live release proof
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const url = `https://vakantti.pages.dev/version.json?verify=${expected}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              const body = await response.text();
              let metadata;
              try {
                metadata = JSON.parse(body);
              } catch {
                metadata = null;
              }

              if (
                response.ok
                && metadata?.commit === expected
                && metadata?.branch === 'main'
                && metadata?.environment === 'production'
              ) {
                console.log(`Verified production commit ${metadata.commit}`);
                process.exit(0);
              }

              console.log(
                `Attempt ${attempt}: status=${response.status}, commit=${metadata?.commit ?? 'missing'}, environment=${metadata?.environment ?? 'missing'}`,
              );
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error instanceof Error ? error.message : String(error)}`);
            }
            await sleep(10_000);
          }

          console.error(`Production did not expose expected release ${expected}`);
          process.exit(1);
          NODE
