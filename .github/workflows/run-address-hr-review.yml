name: Run HR review fixes

on:
  push:
    branches:
      - feature/hr-management-center

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[hr-review-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/hr-management-center
          fetch-depth: 0

      - name: Extract and run reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/address-hr-review.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Setup Node.js"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/address_hr_review.py').write_text(code)
          PY
          python /tmp/address_hr_review.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify complete quality gate
        env:
          VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp
          CF_PAGES: "1"
          CF_PAGES_BRANCH: feature/hr-management-center
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: npm run ship:check

      - name: Commit fixes
        shell: bash
        run: |
          rm .github/workflows/address-hr-review.yml
          rm .github/workflows/run-address-hr-review.yml
          rm -f docs/.hr-review-trigger
          git config user.name "VaKantti automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Korjaa HR-keskuksen katselmointihavainnot [hr-review-fixed]"
          git push origin HEAD:feature/hr-management-center
