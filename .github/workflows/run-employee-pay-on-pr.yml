name: Run employee pay implementation on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'feature/employee-pay-onboarding' && !contains(github.event.pull_request.head.label, ':generated') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/employee-pay-onboarding
          fetch-depth: 0

      - name: Extract and apply implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/implement-employee-pay-onboarding.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Setup Node.js"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/implement_employee_pay.py').write_text(code)
          PY
          python /tmp/implement_employee_pay.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quality gate
        env:
          VITE_SUPABASE_URL: https://qnqhqtzssauwucgnpvfp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_6_STwirtdiJMbWFregmWgg_GtNCC7Fp
          CF_PAGES: "1"
          CF_PAGES_BRANCH: feature/employee-pay-onboarding
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run ship:check

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/implement-employee-pay-onboarding.yml
          rm .github/workflows/run-employee-pay-on-pr.yml
          git config user.name "VaKantti automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Lisää palkkatapa työntekijän luonnin yhteyteen [employee-pay-generated]"
          git push origin HEAD:feature/employee-pay-onboarding
