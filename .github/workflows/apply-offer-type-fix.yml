name: Apply offer type fixes

on:
  push:
    branches:
      - feat/tarjouslaskenta

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[offer-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tarjouslaskenta
          fetch-depth: 0
      - name: Apply exact TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          offers = Path('src/lib/supabase/offers.ts')
          text = offers.read_text()
          old = "      currency: 'EUR',"
          new = "      currency: 'EUR' as const,"
          if old not in text:
              raise SystemExit('Offer currency target not found')
          offers.write_text(text.replace(old, new, 1))

          page = Path('src/pages/Tarjoukset.tsx')
          text = page.read_text()
          old = "  type Offer,\n"
          if old not in text:
              raise SystemExit('Unused Offer import target not found')
          page.write_text(text.replace(old, '', 1))
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git rm .github/workflows/apply-offer-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/offers.ts src/pages/Tarjoukset.tsx
          git commit -m "Fix offer TypeScript types [offer-type-fix]"
          git push origin HEAD:feat/tarjouslaskenta
