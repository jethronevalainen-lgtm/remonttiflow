name: Apply offer route compatibility fix

on:
  push:
    branches:
      - feat/tarjouslaskenta

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[offer-route-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tarjouslaskenta
          fetch-depth: 0
      - name: Preserve legacy offer calculation URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text()
          replacements = {
            '        <Route path="/laskenta" element={<Navigate to="/tarjoukset" replace />} />':
            '        <Route path="/laskenta" element={<RoleGuard allowedRoles={rolesForRoute(\'/laskenta\')}><Tarjoukset /></RoleGuard>} />',
            '        <Route path="/maaralaskenta" element={<Navigate to="/tarjoukset" replace />} />':
            '        <Route path="/maaralaskenta" element={<RoleGuard allowedRoles={rolesForRoute(\'/maaralaskenta\')}><Tarjoukset /></RoleGuard>} />',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Route target not found: {old}')
              text = text.replace(old, new, 1)
          app.write_text(text)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/apply-offer-route-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Preserve legacy calculation routes [offer-route-fix]"
          git push origin HEAD:feat/tarjouslaskenta
